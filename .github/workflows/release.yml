name: Release binaries

# Official distribution builds only; daily validation is performed locally.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Create release for an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" || gh release create "$TAG" --verify-tag --generate-notes

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: geg
          - os: macos-14
            target: aarch64-apple-darwin
            executable: geg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: geg.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: macOS libclang
        if: runner.os == 'macOS'
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll')) { choco install llvm -y }
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> $env:GITHUB_ENV
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check executable starts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          "target/$TARGET/release/$EXECUTABLE" --version
          "target/$TARGET/release/$EXECUTABLE" skill > /dev/null
      - name: Package and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          ARCHIVE="geg-$TAG-$TARGET.tar.gz"
          tar -czf "$ARCHIVE" -C "target/$TARGET/release" "$EXECUTABLE"
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
